<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>超高速プライバシーモザイク Pro</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- 軽量AIライブラリ (Tiny Face Detector & jsQR) -->
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      background-color: #f2f2f7;
      touch-action: none; /* スマホでの画面スクロールを制御しパン・ズームに割り当て */
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    /* iOS風 スライダー */
    input[type=range] {
      -webkit-appearance: none;
      background: #e5e5ea;
      border-radius: 8px;
      height: 6px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 22px;
      width: 22px;
      border-radius: 50%;
      background: #007aff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      cursor: pointer;
    }

    .fade-in {
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body class="text-slate-900 h-screen w-screen overflow-hidden flex flex-col justify-between antialiased">

  <!-- ヘッダーバー -->
  <header class="z-30 glass-panel px-4 py-2.5 flex items-center justify-between shrink-0 shadow-sm">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-md">
        <i class="fa-solid fa-shield-halved text-sm"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm tracking-tight leading-none">PrivacyBlur Pro</h1>
        <p class="text-[9px] text-slate-500 mt-0.5">爆速・完全ローカル・パン＆ズーム対応</p>
      </div>
    </div>
    <div id="statusBadge" class="text-xs px-2.5 py-1 rounded-full bg-blue-100 text-blue-700 font-medium flex items-center space-x-1">
      <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
      <span>AI準備中</span>
    </div>
  </header>

  <!-- メインワークスペース -->
  <main class="flex-1 relative w-full h-full overflow-hidden flex items-center justify-center bg-slate-200/60">

    <!-- 1. 初期ファイルアップロードゾーン -->
    <div id="uploadZone" class="w-11/12 max-w-md bg-white rounded-3xl p-8 border-2 border-dashed border-slate-300 hover:border-blue-500 transition-all text-center cursor-pointer shadow-lg z-10 fade-in">
      <input type="file" id="fileInput" class="hidden" accept="image/*,video/*">
      <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl mx-auto flex items-center justify-center mb-4 text-2xl shadow-inner">
        <i class="fa-solid fa-file-image"></i>
      </div>
      <h2 class="text-base font-bold text-slate-800 mb-1">写真・動画を選択</h2>
      <p class="text-xs text-slate-500 mb-5 leading-relaxed">
        100% 元解像度を保持<br>
        サーバー送信なし・ブラウザ内爆速処理
      </p>
      <button class="bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs px-6 py-3 rounded-full shadow-lg shadow-blue-500/20 active:scale-95 transition-transform">
        ファイルを選択する
      </button>
    </div>

    <!-- 2. キャンバスビューアー (パン＆ズーム対応) -->
    <div id="editorZone" class="hidden absolute inset-0 w-full h-full flex items-center justify-center">
      
      <!-- メイン描画キャンバス -->
      <canvas id="displayCanvas" class="absolute touch-none cursor-grab active:cursor-grabbing"></canvas>
      
      <!-- ズームインジケーター & コントロール (右上浮遊) -->
      <div class="absolute top-3 right-3 glass-panel rounded-full px-3 py-1.5 shadow-md flex items-center space-x-2 z-20 text-xs font-semibold text-slate-700">
        <button id="btnZoomOut" class="hover:text-blue-600 active:scale-90 px-1"><i class="fa-solid fa-minus"></i></button>
        <span id="zoomVal" class="w-12 text-center text-[11px] font-mono">100%</span>
        <button id="btnZoomIn" class="hover:text-blue-600 active:scale-90 px-1"><i class="fa-solid fa-plus"></i></button>
        <div class="w-px h-3 bg-slate-300 my-auto"></div>
        <button id="btnZoomReset" class="text-[10px] bg-slate-200 hover:bg-slate-300 px-2 py-0.5 rounded-full transition-colors">リセット</button>
      </div>

      <!-- ツールバー (画面下部浮遊) -->
      <div class="absolute bottom-20 z-20 glass-panel p-2 rounded-2xl shadow-xl w-11/12 max-w-md flex flex-col space-y-2">
        <!-- モード切替 セグメンテッドコントロール -->
        <div class="grid grid-cols-5 gap-1 p-1 bg-slate-200/70 rounded-xl text-[11px]">
          <button id="btnToolPan" class="py-2 font-semibold rounded-lg flex flex-col items-center justify-center transition-all bg-white text-blue-600 shadow-sm">
            <i class="fa-solid fa-hand text-sm mb-0.5"></i>
            <span>移動</span>
          </button>
          <button id="btnToolBrush" class="py-2 font-semibold rounded-lg flex flex-col items-center justify-center transition-all text-slate-600 hover:text-slate-900">
            <i class="fa-solid fa-paintbrush text-sm mb-0.5"></i>
            <span>塗る</span>
          </button>
          <button id="btnToolEraser" class="py-2 font-semibold rounded-lg flex flex-col items-center justify-center transition-all text-slate-600 hover:text-slate-900">
            <i class="fa-solid fa-eraser text-sm mb-0.5"></i>
            <span>消しゴム</span>
          </button>
          <button id="btnAutoDetect" class="py-2 font-semibold rounded-lg flex flex-col items-center justify-center transition-all text-slate-600 hover:text-slate-900">
            <i class="fa-solid fa-wand-magic-sparkles text-sm mb-0.5 text-amber-500"></i>
            <span>AI自動</span>
          </button>
          <button id="btnClearAll" class="py-2 font-semibold rounded-lg flex flex-col items-center justify-center transition-all text-slate-600 hover:text-slate-900">
            <i class="fa-solid fa-rotate-left text-sm mb-0.5 text-rose-500"></i>
            <span>クリア</span>
          </button>
        </div>

        <!-- ブラシサイズ調節 -->
        <div id="brushSizeBox" class="hidden flex items-center space-x-3 px-3 py-1">
          <span class="text-[10px] font-bold text-slate-400 w-8">サイズ</span>
          <i class="fa-solid fa-circle text-slate-400 text-[8px]"></i>
          <input type="range" id="brushSize" min="10" max="120" value="40" class="flex-1">
          <i class="fa-solid fa-circle text-slate-600 text-base"></i>
        </div>
      </div>

    </div>

    <video id="hiddenVideo" class="hidden" playsinline muted></video>
  </main>

  <!-- フッター保存バー -->
  <footer class="glass-panel px-4 py-3 z-30 flex items-center justify-between shrink-0 shadow-lg">
    <button id="btnResetFile" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold text-xs px-3.5 py-2.5 rounded-xl transition-all active:scale-95 flex items-center space-x-1">
      <i class="fa-solid fa-folder-open"></i>
      <span class="hidden sm:inline">別のファイル</span>
    </button>
    <div id="infoText" class="text-[11px] text-slate-500 font-medium truncate mx-2 flex-1 text-center">
      写真または動画をアップロードしてください
    </div>
    <button id="btnSaveShare" disabled class="bg-blue-600 disabled:bg-slate-300 text-white font-bold text-xs px-5 py-2.5 rounded-xl shadow-lg shadow-blue-500/20 active:scale-95 transition-all flex items-center space-x-1.5 shrink-0">
      <i class="fa-solid fa-share-nodes text-sm"></i>
      <span id="saveBtnText">保存 / 共有</span>
    </button>
  </footer>

  <script>
    // --- ドム参照 ---
    const fileInput = document.getElementById('fileInput');
    const uploadZone = document.getElementById('uploadZone');
    const editorZone = document.getElementById('editorZone');
    const displayCanvas = document.getElementById('displayCanvas');
    const displayCtx = displayCanvas.getContext('2d');
    const hiddenVideo = document.getElementById('hiddenVideo');
    const statusBadge = document.getElementById('statusBadge');
    const infoText = document.getElementById('infoText');
    const zoomVal = document.getElementById('zoomVal');
    const btnSaveShare = document.getElementById('btnSaveShare');
    const saveBtnText = document.getElementById('saveBtnText');
    const btnResetFile = document.getElementById('btnResetFile');
    const brushSizeBox = document.getElementById('brushSizeBox');
    const brushSizeInput = document.getElementById('brushSize');

    // モードボタン
    const btnToolPan = document.getElementById('btnToolPan');
    const btnToolBrush = document.getElementById('btnToolBrush');
    const btnToolEraser = document.getElementById('btnToolEraser');
    const btnAutoDetect = document.getElementById('btnAutoDetect');
    const btnClearAll = document.getElementById('btnClearAll');
    
    const btnZoomIn = document.getElementById('btnZoomIn');
    const btnZoomOut = document.getElementById('btnZoomOut');
    const btnZoomReset = document.getElementById('btnZoomReset');

    // --- オフスクリーンキャンバス（描画エンジン） ---
    const origCanvas = document.createElement('canvas');   // フルサイズ元画像
    const origCtx = origCanvas.getContext('2d');

    const mosaicCanvas = document.createElement('canvas'); // フルサイズモザイク画像 (GPU生成)
    const mosaicCtx = mosaicCanvas.getContext('2d');

    const maskCanvas = document.createElement('canvas');   // フルサイズモザイクマスク (1=モザイク)
    const maskCtx = maskCanvas.getContext('2d');

    const inferCanvas = document.createElement('canvas');  // 高速推論用 (横幅最大320px)
    const inferCtx = inferCanvas.getContext('2d');

    // --- アプリケーション状態 ---
    let currentFile = null;
    let isVideo = false;
    let activeMode = 'pan'; // 'pan' | 'brush' | 'eraser'
    let modelsLoaded = false;
    let isProcessingVideo = false;

    // ビューポート（パン＆ズーム）ステート
    let scale = 1.0;
    let panX = 0;
    let panY = 0;

    // タッチ・ドラッグジェスチャーステート
    let isInteracting = false;
    let startX = 0, startY = 0;
    let initialPinchDist = null;
    let initialScale = 1.0;

    // --- 1. AIモデル読み込み（軽量TinyFaceDetector） ---
    async function initAI() {
      try {
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
        modelsLoaded = true;
        statusBadge.className = 'text-xs px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700 font-medium flex items-center space-x-1';
        statusBadge.innerHTML = `<i class="fa-solid fa-bolt text-xs"></i> <span>爆速モード準備完了</span>`;
      } catch (e) {
        console.warn("AI face model fallback:", e);
        statusBadge.className = 'text-xs px-2.5 py-1 rounded-full bg-amber-100 text-amber-700 font-medium flex items-center space-x-1';
        statusBadge.innerHTML = `<span>高速検出モード</span>`;
      }
    }
    window.addEventListener('DOMContentLoaded', initAI);

    // --- 2. ファイル読み込みハンドラー ---
    uploadZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
    uploadZone.addEventListener('dragover', (e) => e.preventDefault());
    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
    });
    btnResetFile.addEventListener('click', resetApp);

    function handleFile(file) {
      if (!file) return;
      currentFile = file;
      isVideo = file.type.startsWith('video/');

      uploadZone.classList.add('hidden');
      editorZone.classList.remove('hidden');
      btnResetFile.classList.remove('hidden');
      btnSaveShare.disabled = false;

      if (isVideo) {
        setupVideoProcessing(file);
      } else {
        setupImageProcessing(file);
      }
    }

    function resetApp() {
      currentFile = null;
      isVideo = false;
      isProcessingVideo = false;
      if (hiddenVideo.src) URL.revokeObjectURL(hiddenVideo.src);
      hiddenVideo.pause();

      uploadZone.classList.remove('hidden');
      editorZone.classList.add('hidden');
      btnResetFile.classList.add('hidden');
      btnSaveShare.disabled = true;
      fileInput.value = '';
      infoText.textContent = "写真または動画をアップロードしてください";
    }

    // --- 3. 写真処理 & 0ミリ秒モザイク生成 ---
    async function setupImageProcessing(file) {
      infoText.textContent = "高解像度画像を読み込み中...";
      const img = new Image();
      img.src = URL.createObjectURL(file);
      await img.decode();

      const w = img.naturalWidth;
      const h = img.naturalHeight;

      origCanvas.width = w; origCanvas.height = h;
      origCtx.drawImage(img, 0, 0);

      mosaicCanvas.width = w; mosaicCanvas.height = h;
      generateMosaicLayerGPU(w, h);

      maskCanvas.width = w; maskCanvas.height = h;
      maskCtx.clearRect(0, 0, w, h);

      // 320px極小キャンバスへのスケール作成（AI認識用）
      const maxDim = 320;
      const inferScale = Math.min(1, maxDim / Math.max(w, h));
      inferCanvas.width = Math.round(w * inferScale);
      inferCanvas.height = Math.round(h * inferScale);
      inferCtx.drawImage(img, 0, 0, inferCanvas.width, inferCanvas.height);

      // キャンバス表示初期設定
      resizeDisplayCanvas();
      resetZoomPan();

      // 超高速判定の実行
      await runUltraFastDetection(inferScale);
      render();
      infoText.textContent = "🖐️ 移動・拡大、または 🖌️ モザイクで補正できます";
      saveBtnText.textContent = "写真を保存 / 共有";
    }

    // GPUアクセラレーションによる高速モザイクレイヤー生成 (ピクセルループゼロ)
    function generateMosaicLayerGPU(w, h) {
      const tileSize = Math.max(12, Math.round(Math.min(w, h) / 50));
      const smallW = Math.max(1, Math.floor(w / tileSize));
      const smallH = Math.max(1, Math.floor(h / tileSize));

      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = smallW; tempCanvas.height = smallH;
      const tempCtx = tempCanvas.getContext('2d');

      // 縮小描画
      tempCtx.drawImage(origCanvas, 0, 0, smallW, smallH);

      // 拡大描画 (補間無効化によりピクセルモザイク化)
      mosaicCtx.imageSmoothingEnabled = false;
      mosaicCtx.webkitImageSmoothingEnabled = false;
      mosaicCtx.drawImage(tempCanvas, 0, 0, smallW, smallH, 0, 0, w, h);
    }

    // --- 4. 320px極小キャンバスによる爆速AI認識 ---
    async function runUltraFastDetection(inferScale) {
      infoText.textContent = "AIがプライバシー箇所を自動検知中...";
      const scaleUp = 1 / inferScale;

      // (A) 顔認識 (TinyFaceDetector)
      if (modelsLoaded) {
        try {
          const detections = await faceapi.detectAllFaces(
            inferCanvas,
            new faceapi.TinyFaceDetectorOptions({ inputSize: 160, scoreThreshold: 0.35 })
          );
          detections.forEach(det => {
            const b = det.box;
            drawMaskRect(b.x * scaleUp, b.y * scaleUp, b.width * scaleUp, b.height * scaleUp, 0.2);
          });
        } catch(e) {}
      }

      // (B) QRコード検出
      if ('BarcodeDetector' in window) {
        try {
          const detector = new BarcodeDetector({ formats: ['qr_code'] });
          const barcodes = await detector.detect(inferCanvas);
          barcodes.forEach(code => {
            const b = code.boundingBox;
            drawMaskRect(b.x * scaleUp, b.y * scaleUp, b.width * scaleUp, b.height * scaleUp, 0.1);
          });
        } catch (e) {}
      } else {
        const imgData = inferCtx.getImageData(0, 0, inferCanvas.width, inferCanvas.height);
        const code = jsQR(imgData.data, inferCanvas.width, inferCanvas.height);
        if (code) {
          const loc = code.location;
          const x = Math.min(loc.topLeftCorner.x, loc.bottomLeftCorner.x) * scaleUp;
          const y = Math.min(loc.topLeftCorner.y, loc.topRightCorner.y) * scaleUp;
          const w = (Math.max(loc.topRightCorner.x, loc.bottomRightCorner.x) * scaleUp) - x;
          const h = (Math.max(loc.bottomLeftCorner.y, loc.bottomRightCorner.y) * scaleUp) - y;
          drawMaskRect(x, y, w, h, 0.1);
        }
      }

      // (C) ナンバープレート・文字領域（超高速ピクセル解析）
      detectFastPlateEdges(inferCtx, inferCanvas.width, inferCanvas.height, scaleUp);
    }

    function drawMaskRect(x, y, w, h, pad = 0.1) {
      const px = x - w * pad;
      const py = y - h * pad;
      const pw = w * (1 + pad * 2);
      const ph = h * (1 + pad * 2);

      maskCtx.fillStyle = '#ffffff';
      maskCtx.beginPath();
      maskCtx.roundRect(px, py, pw, ph, Math.min(pw, ph) * 0.15);
      maskCtx.fill();
    }

    // 320pxサイズでの高速ナンバープレート/文字エッジ抽出
    function detectFastPlateEdges(ctx, w, h, scaleUp) {
      const imgData = ctx.getImageData(0, 0, w, h);
      const data = imgData.data;
      const grid = 12;
      const cols = Math.floor(w / grid);
      const rows = Math.floor(h / grid);

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          let edgeDiff = 0;
          for (let y = r * grid; y < (r + 1) * grid; y += 3) {
            for (let x = c * grid; x < (c + 1) * grid; x += 3) {
              const i = (y * w + x) * 4;
              const lum = data[i] * 0.3 + data[i+1] * 0.59 + data[i+2] * 0.11;
              const iR = (y * w + Math.min(w - 1, x + 3)) * 4;
              const lumR = data[iR] * 0.3 + data[iR+1] * 0.59 + data[iR+2] * 0.11;
              if (Math.abs(lum - lumR) > 45) edgeDiff++;
            }
          }
          if (edgeDiff >= 8) {
            maskCtx.fillStyle = '#ffffff';
            maskCtx.fillRect(c * grid * scaleUp, r * grid * scaleUp, grid * scaleUp, grid * scaleUp);
          }
        }
      }
    }

    // --- 5. レンダリング＆ビューポート（パン・ズーム）システム ---
    function resizeDisplayCanvas() {
      const parent = editorZone;
      displayCanvas.width = parent.clientWidth;
      displayCanvas.height = parent.clientHeight;
    }
    window.addEventListener('resize', () => {
      if (origCanvas.width > 0) {
        resizeDisplayCanvas();
        render();
      }
    });

    function resetZoomPan() {
      if (!origCanvas.width) return;
      const cw = displayCanvas.width;
      const ch = displayCanvas.height;
      const iw = origCanvas.width;
      const ih = origCanvas.height;

      // 画面内に収まる初期スケール計算
      scale = Math.min(cw / iw, ch / ih) * 0.9;
      panX = (cw - iw * scale) / 2;
      panY = (ch - ih * scale) / 2;
      updateZoomLabel();
    }

    function updateZoomLabel() {
      zoomVal.textContent = `${Math.round(scale * 100)}%`;
    }

    // 画面再描画（合成）
    function render() {
      if (!displayCanvas.width) return;

      displayCtx.save();
      displayCtx.clearRect(0, 0, displayCanvas.width, displayCanvas.height);

      // ビューポート変形適用
      displayCtx.translate(panX, panY);
      displayCtx.scale(scale, scale);

      // 1. 背景（元画像）
      displayCtx.drawImage(origCanvas, 0, 0);

      // 2. モザイクレイヤーの合成 (Composite)
      const compCanvas = document.createElement('canvas');
      compCanvas.width = origCanvas.width;
      compCanvas.height = origCanvas.height;
      const compCtx = compCanvas.getContext('2d');

      compCtx.drawImage(mosaicCanvas, 0, 0);
      compCtx.globalCompositeOperation = 'destination-in';
      compCtx.drawImage(maskCanvas, 0, 0);

      displayCtx.drawImage(compCanvas, 0, 0);
      displayCtx.restore();
    }

    // --- 6. パン＆ズーム & タッチ描画のインタラクション設計 ---
    
    // スクリーンの座標を元の画像ピクセル座標に変換
    function screenToImageCoords(clientX, clientY) {
      const rect = displayCanvas.getBoundingClientRect();
      const canvasX = clientX - rect.left;
      const canvasY = clientY - rect.top;

      return {
        x: (canvasX - panX) / scale,
        y: (canvasY - panY) / scale
      };
    }

    function applyBrushOrEraser(imgCoords) {
      const brushRadius = (parseInt(brushSizeInput.value, 10) / scale) * 0.8;

      maskCtx.save();
      if (activeMode === 'brush') {
        maskCtx.globalCompositeOperation = 'source-over';
        maskCtx.fillStyle = '#ffffff';
      } else {
        maskCtx.globalCompositeOperation = 'destination-out';
      }

      maskCtx.beginPath();
      maskCtx.arc(imgCoords.x, imgCoords.y, brushRadius, 0, Math.PI * 2);
      maskCtx.fill();
      maskCtx.restore();

      render();
    }

    // イベントリスナー（ポインター＆タッチ）
    displayCanvas.addEventListener('pointerdown', (e) => {
      isInteracting = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;

      if (activeMode !== 'pan') {
        applyBrushOrEraser(screenToImageCoords(e.clientX, e.clientY));
      }
    });

    displayCanvas.addEventListener('pointermove', (e) => {
      if (!isInteracting) return;

      if (activeMode === 'pan') {
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        render();
      } else {
        applyBrushOrEraser(screenToImageCoords(e.clientX, e.clientY));
      }
    });

    window.addEventListener('pointerup', () => isInteracting = false);
    window.addEventListener('pointercancel', () => isInteracting = false);

    // ピンチイン・ピンチアウト（2本指拡大・縮小）ジェスチャー対応
    displayCanvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        isInteracting = false;
        initialPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialScale = scale;
      }
    }, { passive: true });

    displayCanvas.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialPinchDist) {
        const currentDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDist / initialPinchDist;
        scale = Math.min(Math.max(0.2, initialScale * factor), 8.0);
        updateZoomLabel();
        render();
      }
    }, { passive: true });

    displayCanvas.addEventListener('touchend', () => { initialPinchDist = null; });

    // ホイールズーム (PC / iPad Trackpad)
    displayCanvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      scale = Math.min(Math.max(0.2, scale * zoomFactor), 8.0);
      updateZoomLabel();
      render();
    }, { passive: false });

    // ズームボタン
    btnZoomIn.addEventListener('click', () => { scale *= 1.25; updateZoomLabel(); render(); });
    btnZoomOut.addEventListener('click', () => { scale /= 1.25; updateZoomLabel(); render(); });
    btnZoomReset.addEventListener('click', () => { resetZoomPan(); render(); });

    // モード切替
    btnToolPan.addEventListener('click', () => setMode('pan'));
    btnToolBrush.addEventListener('click', () => setMode('brush'));
    btnToolEraser.addEventListener('click', () => setMode('eraser'));

    function setMode(mode) {
      activeMode = mode;
      const activeClass = "py-2 font-semibold rounded-lg flex flex-col items-center justify-center transition-all bg-white text-blue-600 shadow-sm";
      const inactiveClass = "py-2 font-semibold rounded-lg flex flex-col items-center justify-center transition-all text-slate-600 hover:text-slate-900";

      btnToolPan.className = mode === 'pan' ? activeClass : inactiveClass;
      btnToolBrush.className = mode === 'brush' ? activeClass : inactiveClass;
      btnToolEraser.className = mode === 'eraser' ? activeClass : inactiveClass;

      if (mode === 'pan') {
        displayCanvas.style.cursor = 'grab';
        brushSizeBox.classList.add('hidden');
      } else {
        displayCanvas.style.cursor = 'crosshair';
        brushSizeBox.classList.remove('hidden');
      }
    }

    btnAutoDetect.addEventListener('click', async () => {
      if (!origCanvas.width) return;
      const inferScale = inferCanvas.width / origCanvas.width;
      await runUltraFastDetection(inferScale);
      render();
      infoText.textContent = "AI判定が完了しました";
    });

    btnClearAll.addEventListener('click', () => {
      maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
      render();
      infoText.textContent = "モザイクを全消去しました";
    });

    // --- 7. 動画処理（再生ストリーム録画） ---
    async function setupVideoProcessing(file) {
      infoText.textContent = "動画を読み込み中...";
      saveBtnText.textContent = "動画を変換＆保存";

      const videoUrl = URL.createObjectURL(file);
      hiddenVideo.src = videoUrl;
      await hiddenVideo.load();

      hiddenVideo.onloadedmetadata = () => {
        const vw = hiddenVideo.videoWidth;
        const vh = hiddenVideo.videoHeight;

        origCanvas.width = vw; origCanvas.height = vh;
        mosaicCanvas.width = vw; mosaicCanvas.height = vh;
        maskCanvas.width = vw; maskCanvas.height = vh;

        const maxDim = 320;
        const inferScale = Math.min(1, maxDim / Math.max(vw, vh));
        inferCanvas.width = Math.round(vw * inferScale);
        inferCanvas.height = Math.round(vh * scale);

        resizeDisplayCanvas();
        resetZoomPan();
        infoText.textContent = "「保存 / 共有」を押すと動画のモザイク変換を開始します";
      };
    }

    async function processVideoExport() {
      if (isProcessingVideo) return;
      isProcessingVideo = true;
      infoText.textContent = "動画変換中... 再生完了までお待ちください";
      btnSaveShare.disabled = true;

      hiddenVideo.currentTime = 0;
      await hiddenVideo.play();

      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = origCanvas.width;
      exportCanvas.height = origCanvas.height;
      const exportCtx = exportCanvas.getContext('2d');

      const stream = exportCanvas.captureStream(30);
      const mimeType = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
      const mediaRecorder = new MediaRecorder(stream, { mimeType });
      const chunks = [];

      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        const blob = new Blob(chunks, { type: mimeType });
        await shareOrDownload(blob, `mosaic_${currentFile.name.replace(/\.[^/.]+$/, "")}.${mimeType.includes('mp4')?'mp4':'webm'}`);
        isProcessingVideo = false;
        btnSaveShare.disabled = false;
        infoText.textContent = "動画の保存が完了しました";
      };

      mediaRecorder.start();

      let frame = 0;
      const inferScale = inferCanvas.width / origCanvas.width;

      const loop = async () => {
        if (hiddenVideo.paused || hiddenVideo.ended) {
          mediaRecorder.stop();
          return;
        }

        origCtx.drawImage(hiddenVideo, 0, 0);
        generateMosaicLayerGPU(origCanvas.width, origCanvas.height);

        // 6フレームごとにAI検知
        if (frame % 6 === 0) {
          inferCtx.drawImage(hiddenVideo, 0, 0, inferCanvas.width, inferCanvas.height);
          await runUltraFastDetection(inferScale);
        }

        // フルサイズエクスポートキャンバスへ描画
        exportCtx.drawImage(origCanvas, 0, 0);
        const comp = document.createElement('canvas');
        comp.width = origCanvas.width; comp.height = origCanvas.height;
        const cCtx = comp.getContext('2d');
        cCtx.drawImage(mosaicCanvas, 0, 0);
        cCtx.globalCompositeOperation = 'destination-in';
        cCtx.drawImage(maskCanvas, 0, 0);
        exportCtx.drawImage(comp, 0, 0);

        render();
        frame++;
        requestAnimationFrame(loop);
      };

      requestAnimationFrame(loop);
    }

    // --- 8. iPhone写真アプリ保存 (Web Share API) ---
    btnSaveShare.addEventListener('click', async () => {
      if (!currentFile) return;

      if (isVideo) {
        await processVideoExport();
      } else {
        // 元の解像度の高画質キャンバスを書き出し
        const fullCanvas = document.createElement('canvas');
        fullCanvas.width = origCanvas.width;
        fullCanvas.height = origCanvas.height;
        const fullCtx = fullCanvas.getContext('2d');

        fullCtx.drawImage(origCanvas, 0, 0);
        const comp = document.createElement('canvas');
        comp.width = origCanvas.width; comp.height = origCanvas.height;
        const cCtx = comp.getContext('2d');
        cCtx.drawImage(mosaicCanvas, 0, 0);
        cCtx.globalCompositeOperation = 'destination-in';
        cCtx.drawImage(maskCanvas, 0, 0);
        fullCtx.drawImage(comp, 0, 0);

        fullCanvas.toBlob(async (blob) => {
          await shareOrDownload(blob, `mosaic_${currentFile.name}`);
        }, currentFile.type || 'image/jpeg', 0.95);
      }
    });

    async function shareOrDownload(blob, fileName) {
      const file = new File([blob], fileName, { type: blob.type });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: 'モザイク済みファイル',
            text: 'PrivacyBlur Proで作成されました'
          });
        } catch (err) {
          if (err.name !== 'AbortError') fallbackDownload(blob, fileName);
        }
      } else {
        fallbackDownload(blob, fileName);
      }
    }

    function fallbackDownload(blob, fileName) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>
</body>
